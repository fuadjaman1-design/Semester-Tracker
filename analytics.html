<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Semester Tracker - Weekly Analysis</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="dashboard.html">&larr; Back to Dashboard</a>
    <h1>Weekly Analysis</h1>
  </header>

  <main>

    <!-- ===================== -->
    <!-- WEEKLY BREAKDOWN (TEXT) -->
    <!-- ===================== -->
    <section id="weekly-breakdown-section">
      <h2>Weekly Breakdown</h2>
      <!-- Weekly summaries will be added here dynamically by analytics.js -->
      <div id="weekly-breakdown-list"></div>
    </section>

    <!-- ===================== -->
    <!-- GRAPH -->
    <!-- ===================== -->
    <section id="graph-section">
      <h2>Progress Graph</h2>
      <canvas id="progress-graph"></canvas>
    </section>

  </main>

  <!-- =====================================================
       FIREBASE SDK (Compat version)
       ===================================================== -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Charting library (used later, for the graph) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Our own JS files -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
   <script src="js/analytics.js"></script> 

</body>
</html>
