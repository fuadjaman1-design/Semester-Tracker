name: Smart study reminders

on:
  schedule:
    # 00:00 (midnight) and 12:00 (noon) in Bangladesh (UTC+6).
    - cron: "0 6,18 * * *"
    # 20:15 (8:15 PM) in Bangladesh (UTC+6).
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-study-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notifications:send
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
