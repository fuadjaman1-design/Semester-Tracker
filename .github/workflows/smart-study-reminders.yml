name: Smart study reminders

on:
  schedule:
    # 08:17, 14:17 and 20:17 in Bangladesh (UTC+6).
    - cron: "17 2,8,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-study-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notifications:send
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

